<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamiento</title>
<style>
:root{
  --bg:#0B0E12;
  --card:#141920;
  --card2:#1B222B;
  --line:#262E38;
  --text:#EAEFF3;
  --muted:#8A96A3;
  --accent:#FF5E3A;
  --cp:#3FD1C4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(28px,env(safe-area-inset-top)) 16px 48px;
  max-width:720px;
  margin-inline:auto;
  min-height:100dvh;
}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.menu{display:flex;flex-direction:column;gap:14px}
.tile{
  display:block;
  text-decoration:none;
  color:inherit;
  background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px 22px;
  min-height:140px;
}
.tile:active{opacity:.9}
.tile .kicker{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.tile .label{
  font-size:28px;
  font-weight:700;
  letter-spacing:-.02em;
  margin:0 0 8px;
}
.tile .desc{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.tile.run .label{color:var(--accent)}
.tile.str .label{color:var(--cp)}
</style>
</head>
<body>
<h1>Entrenamiento</h1>
<div class="sub">Elige la herramienta · portal plano, se irá ampliando</div>
<nav class="menu">
  <a class="tile run" href="running.html">
    <div class="kicker">Potencia y zonas</div>
    <div class="label">RUNNING</div>
    <p class="desc">Calculadora de potencia basada en tu Race Calculator y CP.</p>
  </a>
  <a class="tile str" href="rutina_fuerza.html">
    <div class="kicker">Gimnasio</div>
    <div class="label">STRENGTH</div>
    <p class="desc">Rutina de fuerza, sesión por sesión, para verla mientras entrenas.</p>
  </a>
</nav>
</body>
</html>
